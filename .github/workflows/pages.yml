# Chirpy 使用 Jekyll 4，与 GitHub 默认的 github-pages（Jekyll 3）不兼容。
# 因此本仓库不使用 GitHub 自动生成的 "Static HTML" 工作流
# （actions/jekyll-build-pages@v1，固定 Jekyll 3.10 且不读取 Gemfile），
# 而是在 CI 中按 Gemfile 安装依赖并构建，再部署静态站点。
name: Deploy Jekyll site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 官方建议：不要用 cancel-in-progress 取消进行中的部署，
# 否则可能造成 Pages 部署状态不一致。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # html-proofer 属于测试组，CI 构建时跳过
      BUNDLE_WITHOUT: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          # 按 Gemfile / Gemfile.lock 缓存并安装依赖
          bundler-cache: true

      # 自检：确认装到的是 Jekyll 4 且主题可用，
      # 避免再次出现 "The jekyll-theme-chirpy theme could not be found"
      - name: Verify Jekyll environment
        run: |
          bundle exec jekyll --version
          bundle exec ruby -e 'require "jekyll"; puts "jekyll gem: #{Jekyll::VERSION}"'
          bundle list | grep -E "jekyll-theme-chirpy" \
            || { echo "::error::jekyll-theme-chirpy 未安装，构建中止"; exit 1; }

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
