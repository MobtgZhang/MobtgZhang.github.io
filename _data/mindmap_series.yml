      - no: "A"
        title: 智能计算
        desc: 进化计算、群智能、教学与谐振三条主线，外加模拟退火这一基准方法。
        items:
          - title: 智能优化算法家谱
            note: 页面主体就是这张图，按机制分族
            url: /mindmap-viewer/
